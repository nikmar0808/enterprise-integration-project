name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  java-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test Java service
        working-directory: 01-java-ingestion-service
        run: mvn -B verify

  python-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: 02-python-transformation-api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: 02-python-transformation-api
        run: pytest tests

  docker-build-push-java:
    needs: java-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./01-java-ingestion-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eai-java-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eai-java-gateway:latest

  docker-build-push-python:
    needs: python-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./02-python-transformation-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eai-python-validator:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eai-python-validator:latest
